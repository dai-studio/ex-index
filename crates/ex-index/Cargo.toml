[package]
name = "ex-index"
description = "Single-binary vector search server (DiskANN) with a JSON REST API and admin UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ex-index"
path = "src/main.rs"

[dependencies]
ex-index-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
askama = "0.16.1"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
sha2 = "0.11.1"
subtle = "2.6.1"
getrandom = "0.4.3"
hex = "0.4.3"
# Outbound HTTPS to Cloudflare Workers AI: rustls + ring, bundled Mozilla roots
# so the static binary needs no system certificate store.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.12"

[dev-dependencies]
tempfile.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form"] }
