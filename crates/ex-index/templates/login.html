{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card login">
  <div class="card-header">
    <h3 class="card-title">Log in</h3>
    <p class="card-description">This server requires its API key.</p>
  </div>
  <div class="card-content">
    <form class="form" method="post" action="/ui/login">
      <input type="hidden" name="csrf" value="{{ layout.csrf }}">
      <div class="form-field">
        <label class="label" for="key">API key</label>
        <input class="input" id="key" name="key" type="password" autocomplete="current-password" required autofocus>
      </div>
      <div class="form-actions"><button class="btn" data-variant="default" type="submit">Log in</button></div>
    </form>
  </div>
</div>
{% endblock %}
